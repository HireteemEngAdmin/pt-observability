# Single binary, storage on local disk. Not multi-tenant: auth_enabled is false
# and access is gated by Caddy's basic auth at the edge.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-07-28
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30 days — the team's decision; these logs carry PII, do not raise it
  # without discussing first.
  retention_period: 720h
  # PM2 logs can arrive late when Alloy restarts and replays a file.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  # Without retention_enabled the retention_period above is silently ignored.
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  apply_retention_interval: 1h

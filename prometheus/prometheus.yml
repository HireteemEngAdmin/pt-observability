# Targets apontam para a EC2 da aplicacao (DNS publico estavel/EIP, nunca IP
# efemero) e sao os mesmos independente de onde este stack rodar. DNS publico
# nao e segredo: fica commitado.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['SUBSTITUA_EC2_DNS_PUBLICO:3000'] # porta real da API (Fase 0 do plano)

  - job_name: cron
    static_configs:
      - targets: ['SUBSTITUA_EC2_DNS_PUBLICO:9464']

  - job_name: node
    static_configs:
      - targets: ['SUBSTITUA_EC2_DNS_PUBLICO:9100']

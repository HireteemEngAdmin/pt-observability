# Targets point at the application EC2 through its stable public DNS / EIP,
# never an ephemeral IP, and stay the same wherever this stack runs. A public
# DNS name is not a secret, so it is committed.
#
# All three metric ports are open to 0.0.0.0/0 in the security group — the
# decision was to keep the observability host's IP out of the AWS rules.
# Consequences per port:
# - api :3000 and cron :9464 serve application metrics without auth, which is
#   what the API already did before this stack existed.
# - node :9100 would expose the kernel version, the private IP and the host
#   topology, so it runs behind TLS and basic auth
#   (node_exporter --web.config.file). See the README.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['ec2-44-220-173-115.compute-1.amazonaws.com:3000']

  - job_name: cron
    static_configs:
      - targets: ['ec2-44-220-173-115.compute-1.amazonaws.com:9464']

  - job_name: node
    scheme: https
    basic_auth:
      username: prometheus
      # Mounted by compose from ./secrets, which is outside git.
      password_file: /etc/prometheus/secrets/node_exporter_password
    tls_config:
      # The EC2's self-signed cert is pinned as the CA rather than using
      # insecure_skip_verify, so the scrape fails if the certificate is swapped
      # in transit instead of silently accepting it.
      ca_file: /etc/prometheus/node_exporter-ca.crt
      server_name: ec2-44-220-173-115.compute-1.amazonaws.com
    static_configs:
      - targets: ['ec2-44-220-173-115.compute-1.amazonaws.com:9100']

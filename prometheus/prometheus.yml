# Targets point at the application EC2 through its stable public DNS / EIP,
# never an ephemeral IP, and stay the same wherever this stack runs. A public
# DNS name is not a secret, so it is committed.
#
# All three metric ports are open to 0.0.0.0/0 in the security group — the
# decision was to keep the observability host's IP out of the AWS rules.
# Consequences per port:
# - api :3000 and cron :9464 serve application metrics without auth, which is
#   what the API already did before this stack existed.
# - node :9100 would expose the kernel version, the private IP and the host
#   topology, so it runs behind TLS and basic auth
#   (node_exporter --web.config.file). See the README.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['ec2-44-220-173-115.compute-1.amazonaws.com:3000']

  # The cron runs on its own EC2, separate from the API. Only this job moved:
  # `api` and `node` still point at the application host.
  #
  # The job name is load bearing. Every cron panel selects on job="cron", in
  # Prometheus and in Loki alike, and nothing filters on host or instance, so
  # the dashboards follow the target without being touched.
  #
  # This address is now an Elastic IP, which is the only reason it can be
  # written down here. Resizing the instance stopped and started it, AWS handed
  # back a different auto-assigned address, and this job scraped the old
  # hostname until someone noticed the Grafana panels had gone quiet. The
  # application was healthy throughout: only the scrape target was stale.
  #
  # The application host is still on an auto-assigned address, so `api` and
  # `node` below carry the same fault and will break the first time that
  # instance stops. Pin it too rather than waiting to rediscover this.
  - job_name: cron
    static_configs:
      - targets: ['ec2-3-94-73-166.compute-1.amazonaws.com:9464']

  # The CI poller, on the same host as the cron and for the same reason: it is the
  # thing that runs CI now that GitHub Actions is suspended. Separate port because it
  # is a separate PM2 process with its own lifecycle, and a separate job so a panel can
  # tell "the poller is down" from "the cron is down".
  #
  # The one metric that justifies scraping it at all is
  # ci_poller_last_poll_timestamp_seconds. If the poller stops, CI stops, and nothing
  # else reports that: no build starts, no commit status is posted, and every pull
  # request simply waits. Scrape failure alone is not enough to detect it, because a
  # process that is up but wedged still answers; the timestamp going stale is what
  # catches both.
  #
  # Same pinned Elastic IP hostname as the cron job above, for the reason documented
  # there.
  - job_name: ci-poller
    static_configs:
      - targets: ['ec2-3-94-73-166.compute-1.amazonaws.com:9465']

  - job_name: node
    scheme: https
    basic_auth:
      username: prometheus
      # Mounted by compose from ./secrets, which is outside git. Kept beside
      # /etc/prometheus rather than inside it, because that directory is now a
      # read-only bind mount and nesting into one is runtime dependent.
      password_file: /etc/prometheus-secrets/node_exporter_password
    tls_config:
      # The EC2's self-signed cert is pinned as the CA rather than using
      # insecure_skip_verify, so the scrape fails if the certificate is swapped
      # in transit instead of silently accepting it.
      ca_file: /etc/prometheus/node_exporter-ca.crt
      server_name: ec2-44-220-173-115.compute-1.amazonaws.com
    static_configs:
      - targets: ['ec2-44-220-173-115.compute-1.amazonaws.com:9100']

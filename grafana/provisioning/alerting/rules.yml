# Alert rules for the CI poller, the deploys it runs, and the clock service.
#
# These are the first alert rules this stack has ever had. Until now prometheus.yml
# carried no `rule_files` and no `alerting` block, and there is no Alertmanager, so
# backend/scripts/lu-ops/alert-rules.yaml in the application repo has never been loaded
# by anything. Grafana 11 has unified alerting built in, which is why these live here
# and need no new container.
#
# There is deliberately no contact point yet. contactpoints.yml.example and
# policies.yml.example are the Teams webhook, still pending approval; renaming those two
# files is all it takes for every rule below to start routing, with no change here.
# Until then these fire into the Grafana UI only, which catches a red main during the
# day and will not wake anyone at night. That is a known limit, chosen deliberately.
#
# Two rules that could have been written are not, and the reasons matter more than the
# rules would have:
#
#   MainGreenButNotDeployed. Automatic deploys are off (CI_POLLER_DEPLOY), so main is
#   green and undeployed by design right now. Shipping it today means an alert that is
#   red from the first minute, and an alert that is always red teaches people to ignore
#   the whole page. Add it with the flag.
#
#   SpotReclaimStorm. Reclaims are expected: Spot carries the work at roughly a third of
#   the price and the first build ever run here was reclaimed. Without a measured normal
#   rate any threshold is a guess, and a guessed threshold is how alert fatigue starts.
#
# noDataState is set per rule and is not boilerplate. For the watchdog, the metric going
# missing IS the failure, so it alerts. For everything else absence means the thing has
# simply not happened yet, so it stays OK.
apiVersion: 1

groups:
  - orgId: 1
    name: ci
    folder: Performance Tracker
    interval: 1m
    rules:
      # The one that justifies the rest. If the poller stops, CI stops silently: no
      # build starts, no commit status is posted, and every pull request just waits.
      # Nothing else in the system reports that.
      - uid: ci-poller-stalled
        title: CIPollerStalled
        condition: THRESHOLD
        # Alerting, not OK: a scrape that returns nothing means the process is gone or
        # wedged, which is exactly the condition this exists to catch. Every other rule
        # here treats missing data as "has not happened yet"; this one cannot.
        noDataState: Alerting
        execErrState: Error
        # The poller cycles every 60s and restarts on its own deploys. Two minutes past
        # a five minute threshold rides out a restart without riding out a real stall.
        for: 2m
        labels: { severity: p1, service: ci }
        annotations:
          summary: The CI poller has not completed a cycle in over 5 minutes
          description: >-
            CI is not running. Nothing else reports this: builds do not start and pull
            requests wait without a status. Check `pm2 logs ci-poller` on the cron host.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: time() - ci_poller_last_poll_timestamp_seconds
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [300] }

      - uid: ci-main-red
        title: CIMainRed
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: p2, service: ci }
        annotations:
          summary: main has been failing validation for over 30 minutes
          description: >-
            The last build of main failed and nothing has fixed it since. Deploys are
            gated on a green main, so this also means nothing can ship.
        data:
          # Both series carry ref_type="main", so the comparison matches label for label
          # and returns the failure timestamp when it is the more recent of the two.
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                (ci_last_failure_timestamp_seconds{ref_type="main"}
                > ci_last_success_timestamp_seconds{ref_type="main"}) > bool 0
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: ci-queue-backlog
        title: CIQueueBacklog
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: p2, service: ci }
        annotations:
          summary: The CI queue has been above 5 for 15 minutes
          description: >-
            Builds are arriving faster than they finish. The poller runs one at a time
            because its checkout is shared, so a sustained queue means the backlog only
            grows. A burst after several merges is normal; sustained is not.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: ci_queue_depth
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }

  - orgId: 1
    name: deploys
    folder: Performance Tracker
    interval: 1m
    rules:
      - uid: deploy-failed
        title: DeployFailed
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: p1, service: deploy }
        annotations:
          summary: An automatic deploy failed
          description: >-
            A failed deploy has nowhere else to report. The commit status already says
            the code is good, and it is: what failed is putting it out there. The stage
            label says how far it got, and `verify` is the interesting one, because it
            means every step succeeded and the wrong code is serving.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: sum(increase(deploy_total{status="failure"}[10m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The failure the deploy scripts have always worked around blind: an aborted
      # `git pull` leaves the old tree serving while every step reports success.
      - uid: deploy-version-mismatch
        title: DeployedVersionMismatch
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: p1, service: deploy }
        annotations:
          summary: A host is not running the commit the deploy shipped
          description: >-
            The poller read app_build_info back off the host and it disagrees with the
            SHA it just deployed. Every deploy step reported success and the wrong code
            is serving. Compare the version table on the CI and Deploys dashboard.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: min(deploy_version_verified)
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: hosts-out-of-sync
        title: HostsOutOfSync
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        # A deploy legitimately makes the hosts disagree while it walks from the server
        # to the cron. Twenty minutes is far longer than that gap and far shorter than
        # anyone would tolerate the drift.
        for: 20m
        labels: { severity: p2, service: deploy }
        annotations:
          summary: The server and the cron are running different commits
          description: >-
            A deploy reached one host and not the other. Until app_build_info existed
            this was only discoverable by sshing into each host and running
            `git rev-parse`, which is why it could persist unnoticed.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: count(count by (commit) (app_build_info))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }

  - orgId: 1
    name: clock
    folder: Performance Tracker
    interval: 1m
    rules:
      # The one that justifies the rest. ClockEventsBacklog, ClockEventsQuarantined and
      # ClockDrainLatencyHigh all read values the drain itself publishes, so all three
      # go quiet, not red, exactly when the drain stops: a frozen gauge does not cross
      # 50, a dead counter does not increment, and a stale histogram stops feeding new
      # buckets. This is the only one of the four watching whether the drain is still
      # alive at all.
      #
      # Watches cronjob_last_run_timestamp_seconds, set unconditionally at the start
      # of every run (instrumentCronJob.js:174), not cronjob_last_success_timestamp_
      # seconds, which is only set when status is 'success' (instrumentCronJob.js:252).
      # The drain quarantines only foreign-key violations; every other error retries
      # indefinitely by design, so a single poison non-FK event marks every run
      # 'partial' forever and would freeze last_success on a drain that is otherwise
      # healthy and still draining everyone else. That is the always-red failure this
      # file's header already rejects two other rules for.
      - uid: clock-drain-stalled
        title: ClockDrainStalled
        condition: THRESHOLD
        # Alerting, not OK: a scrape that returns nothing means the drain is gone or
        # wedged, which is exactly the condition this exists to catch. Every other
        # clock rule here treats missing data as "has not happened yet"; this one
        # cannot, for the same reason CIPollerStalled cannot. Kept Alerting even
        # across a deliberate CLOCK_SERVICE_ENABLED=false rollback: a clock service
        # that is not running is worth a page, arguably especially then, so nobody
        # forgets it is off. See the annotation for what that means for an operator
        # doing a planned rollback.
        noDataState: Alerting
        execErrState: Error
        # The drain cycles every 60s and restarts on its own deploys. Two minutes past
        # a five minute threshold rides out a restart without riding out a real stall.
        for: 2m
        labels: { severity: p1, service: clock }
        annotations:
          summary: The clock events drain has not run in over 5 minutes
          description: >-
            Punches have stopped reaching time_tracker entirely, and nothing else in
            this file reports it: ClockEventsBacklog and ClockEventsQuarantined can
            both stay silent while the drain is down, since a frozen gauge does not
            grow and a dead counter does not increment. Check the cron process's logs
            for the clock-events-drain job and restart it if the process itself is
            gone. A deliberate CLOCK_SERVICE_ENABLED=false rollback also fires this
            rule; if that is what is happening, silence it in Grafana for the
            rollback's duration rather than treating this page as a surprise.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: time() - cronjob_last_run_timestamp_seconds{job_name="clock-events-drain"}
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [300] }

      # The drain writes queued punches to Postgres in batches; a backlog means it is
      # falling behind, not that a punch is lost yet. Ten minutes rides out a normal
      # burst (shift start/end) without riding out a drain that has actually stalled.
      #
      # noDataState stays OK, not Alerting, even though a vanished drain is exactly
      # what would cause this series to disappear: ClockDrainStalled above is the rule
      # built for that (it watches the same job's own heartbeat, set at the same
      # instant as this gauge), so promoting this one too would just page twice for
      # one root cause without adding coverage.
      - uid: clock-events-backlog
        title: ClockEventsBacklog
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: p2, service: clock }
        annotations:
          summary: The clock event queue has been above 50 for 10 minutes
          description: >-
            Punches are queued faster than the drain writes them to Postgres. Check the
            cron process's logs for the clock-events-drain job before assuming it is
            only load: this is a gauge, so a drain that dies outright leaves it frozen
            at whatever it last reported, and a reading under 50 does not by itself
            prove the drain is healthy. If the drain is gone entirely, ClockDrainStalled
            is the rule that catches it.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: clock_events_pending
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [50] }

      # Not increase(): prom-client creates no child series until the first .inc(), so
      # when a quarantine is the first one since the last restart, every sample in the
      # 10m window holds the same value and the raw delta is 0. increase() would then
      # miss the very event this rule exists to catch, on every cron restart, because
      # quarantines are rare enough that most are a first. The diff below catches a
      # series that did not exist 10m ago (sum() over no series is empty, and
      # `or vector(0)` supplies the zero), clears on its own once the count has been
      # flat across the whole window, and goes negative rather than positive on a
      # counter reset, so a deploy cannot cause a false page.
      - uid: clock-events-quarantined
        title: ClockEventsQuarantined
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        # A quarantine needs a human now, not after riding out a dip that will not
        # recur on its own.
        for: 0m
        labels: { severity: p1, service: clock }
        annotations:
          summary: A clock event was quarantined after exhausting its retries
          description: >-
            This event will not reach time_tracker without a human. It has already
            left the pending queue, so query the events table (CLOCK_EVENTS_TABLE,
            normally pt-clock-prod-events) for the item with quarantined_at set, read
            last_error, and replay or hand-fix it in Postgres before its ttl expires
            the record.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 1500, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                sum(clock_events_quarantined_total) - (sum(clock_events_quarantined_total
                offset 10m) or vector(0))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 60 is one of the histogram's own bucket boundaries, not an interpolated guess,
      # so this fires exactly when more than 5% of punches cross a full minute.
      # Reads the fraction of punches inside the 60s bucket rather than
      # histogram_quantile, and this is not a refactor. On 2026-09-02 the drain was
      # denied DynamoDB for 75 minutes; when it recovered, 108 of 111 observations
      # landed above 120s, and the quantile form reported 44.8s and never fired.
      # The top finite bucket is 120s, so once a breach exceeds it the histogram can
      # no longer say by how much and the quantile degrades in exactly the case worth
      # paging on. A ratio against le="60" cannot degrade that way: it is the design
      # promise stated directly, "at least 95% of punches land within a minute".
      - uid: clock-drain-latency-high
        title: ClockDrainLatencyHigh
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: p2, service: clock }
        annotations:
          summary: more than 5% of punches took over 60s to reach time_tracker
          description: >-
            Check ClockJobFailing and ClockEventsBacklog first: latency rises when the
            drain falls behind, not usually because a single write is slow. A window
            with no punches makes both sides zero, so the ratio is NaN and does not
            satisfy this threshold, and the rule stays silent rather than paging on
            empty data.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                sum(rate(clock_event_latency_seconds_bucket{le="60"}[10m]))
                /
                sum(rate(clock_event_latency_seconds_bucket{le="+Inf"}[10m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.95] }

      # The gap the 2026-09-02 incident proved. The drain was denied DynamoDB for 75
      # minutes and not one of the other four rules fired, each for its own reason:
      # ClockEventsBacklog reads clock_events_pending, which the drain itself sets, so
      # a run that throws before that line leaves the gauge frozen at its last value
      # (it read 0 throughout); ClockDrainStalled watches last_run_timestamp, which
      # kept updating because the job ran every minute and failed; and
      # ClockDrainLatencyHigh had no observations to quantile while nothing drained.
      # The only true signal was cronjob_last_run_status, which had a panel and no
      # alert. This is that alert.
      #
      # Covers all three clock jobs rather than the two on the data path. A poller-only
      # failure paging at p1 is over-eager, and that is the accepted cost: under-alerting
      # on the drain is what made a 75-minute write outage invisible. Split it if the
      # poller proves noisy.
      #
      # Deliberately NOT fleet-wide. The same gap covers the other 22 cron jobs, and
      # distributor-delivery has 68 error runs and zero successes right now, so a
      # fleet-wide rule would fire on merge for a pre-existing failure nobody has
      # triaged. That is how a new alert gets silenced in its first week. Widening this
      # belongs to whoever owns those jobs, after they triage what it would surface.
      - uid: clock-job-failing
        title: ClockJobFailing
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: p1, service: clock }
        annotations:
          summary: a clock cron job has been failing for 5 minutes
          description: >-
            The job named in job_name is completing with status=error. If it is
            clock-events-drain, punches are being recorded in DynamoDB but are not
            reaching time_tracker, and they will drain on their own once the job
            recovers. Read the error on the cron host with
            "pm2 logs cron --lines 200 --nostream | grep <job_name>". The 2026-09-02
            case was an IAM policy version applied without rendering __ENV__, which
            revoked DynamoDB from the whole cron user.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                max by (job_name)
                (cronjob_last_run_status{job_name=~"clock-.*", status="error"})
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The failure mode no other rule here can see. On 2026-09-01 the clock API
      # returned 24 5xx in one hour while aws_lambda_errors read 0 for the same window,
      # and both were right: index.js catches every exception and returns json(500, ...),
      # which AWS counts as a successful invocation. The Errors metric only sees
      # unhandled exceptions and timeouts, so the panel labelled "should read zero" read
      # zero while 24 people got a 500. The gateway's own 5xx is the only signal that
      # sees a handled one.
      #
      # Sum rather than a rate: this is a gauge the CloudWatch poller rewrites every five
      # minutes holding the gateway's own Sum for its window, so rate() and increase() are
      # both wrong on it, and max_over_time answers the question the panel next to it asks.
      # A quiet window publishes 0, not nothing, so an absent series means the poller is
      # down or CLOCK_API_GATEWAY_ID is wrong, and ClockJobFailing covers the first.
      - uid: clock-api-5xx
        title: ClockApiServerErrors
        condition: THRESHOLD
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: p1, service: clock }
        annotations:
          summary: the clock API returned server errors in the last five minutes
          description: >-
            Members are getting a 500 from clock-in, clock-out or status. This does not
            show up in aws_lambda_errors, which reads 0 for a handled 500, so this rule
            is the only alert that sees it. The Lambda logs the upstream cause at warn
            level before returning; read them in CloudWatch Logs for /aws/lambda/
            pt-clock-prod. The 2026-09-01 occurrence was 24 errors inside a single hour
            with nothing either side, which is the shape of one upstream cause rather
            than a chronic rate.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              editorMode: code
              expr: max(aws_apigateway_5xx)
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

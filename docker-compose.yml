services:
  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=180d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Cert autoassinado do node_exporter, pinado como CA no scrape do job node.
      - ./prometheus/node_exporter-ca.crt:/etc/prometheus/node_exporter-ca.crt:ro
      # Senha do basic auth do node_exporter (./secrets nao vai para o git).
      - ./secrets:/etc/prometheus/secrets:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    # sem ports: so o Caddy (push) e o Grafana (query) falam com ele

  grafana:
    image: grafana/grafana:11.5.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
      # fase futura (alertas): descomentar junto com os .example de provisioning/alerting/
      # - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    environment:
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN}
    # Basic auth do push do Loki. NAO usar `environment` com ${...} aqui: o hash
    # bcrypt tem a forma $2a$14$<salt>..., e o Compose interpola o $<salt> como
    # variavel inexistente e o substitui por vazio — o hash chega mutilado no
    # container, o Caddy aceita a config como valida e toda autenticacao falha
    # com 401. `env_file` entrega o valor literal, sem interpolacao.
    env_file:
      - ./secrets/caddy.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

# Nomes fixos (sem prefixo do projeto) para os scripts de backup/restore
# funcionarem igual em qualquer host.
volumes:
  prom-data:
    name: pt-obs-prom-data
  grafana-data:
    name: pt-obs-grafana-data
  caddy-data:
    name: pt-obs-caddy-data
  loki-data:
    name: pt-obs-loki-data

services:
  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=180d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # node_exporter's self-signed cert, pinned as the CA for the node job.
      - ./prometheus/node_exporter-ca.crt:/etc/prometheus/node_exporter-ca.crt:ro
      # node_exporter basic auth password (./secrets never reaches git).
      - ./secrets:/etc/prometheus/secrets:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    # No ports: only Caddy (push) and Grafana (query) talk to it.

  grafana:
    image: grafana/grafana:11.5.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Future phase (alerting): uncomment together with the .example files in
      # provisioning/alerting/.
      # - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
    # The Postgres datasource's password reaches provisioning through this file
    # rather than through .env, for the same reason the Caddy credential does:
    # it stays in secrets/, which is gitignored. Unlike the Caddy bcrypt hash it
    # contains no `$`, so it needs no doubling.
    env_file:
      - ./secrets/grafana-postgres.env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    environment:
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN}
    # Basic auth for the Loki push endpoint, kept out of .env.
    #
    # Compose interpolates $VAR in BOTH `environment` and `env_file`. A bcrypt
    # hash has the shape $2a$14$<salt>..., so Compose reads $<salt> as an
    # undefined variable and drops it: the hash arrives mutilated, Caddy accepts
    # the config as valid, and every request fails with 401 — including the
    # correct credential.
    #
    # env_file does not make that go away. The `$` must be written doubled in
    # secrets/caddy.env, and Compose turns `$$` back into a single `$`. See the
    # README for the generation command.
    env_file:
      - ./secrets/caddy.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

# Fixed names, without the project prefix, so the backup/restore scripts behave
# identically on any host.
volumes:
  prom-data:
    name: pt-obs-prom-data
  grafana-data:
    name: pt-obs-grafana-data
  caddy-data:
    name: pt-obs-caddy-data
  loki-data:
    name: pt-obs-loki-data
